media:
  input: src/assets/medias
  output: /src/assets/medias

content:
  - name: homepage
    label: Home page
    type: single
    path: src/pages/index.mdx
    fields:
      - { name: title, label: Titre, type: string }
      - { name: description, label: Description, type: string }
      - { name: image, label: Image, type: string }
      - {
          name: imgtitle,
          label: Titre de l’image,
          type: string,
          required: false,
        }
      - { name: author, label: Auteur, type: string, required: false }
      - { name: date, label: Date, type: date }
      - { name: metaTitle, label: Meta Title (SEO), type: string }
      - { name: metaDescription, label: Meta Description (SEO), type: string }
      - {
          name: asideComponents,
          label: Composants aside,
          type: list,
          of: string,
        }
      - { name: body, label: Contenu principal, type: markdown }

  - name: pages
    label: Pages du site
    type: collection
    path: src/pages
    match: '*.mdx'
    exclude: 'index.mdx'
    view:
      fields: [title, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Titre, type: string }
      - { name: description, label: Description, type: string }
      - { name: image, label: Image, type: string }
      - {
          name: imgtitle,
          label: Titre de l’image,
          type: string,
          required: false,
        }
      - { name: author, label: Auteur, type: string, required: false }
      - { name: date, label: Date, type: date }
      - { name: metaTitle, label: Meta Title (SEO), type: string }
      - { name: metaDescription, label: Meta Description (SEO), type: string }
      - {
          name: asideComponents,
          label: Composants aside,
          type: list,
          of: string,
        }
      - { name: body, label: Contenu principal, type: markdown }

  - name: media
    label: Médias
    type: media

  - name: siteConfig
    label: Configuration générale
    type: single
    path: src/site-config.ts
    fields:
      - { name: bannerMessage, label: Message de bannière, type: string }
      - name: mainMenu
        label: Menu principal
        type: list
        of:
          type: object
          fields:
            - { name: url, label: URL, type: string }
            - { name: title, label: Titre, type: string }
            - { name: description, label: Description, type: string }
      - { name: ticketPrice, label: Prix d'entrée, type: string }
      - { name: parkingPrice, label: Prix du parking, type: string }
      - { name: googleMapsLink, label: Lien Google Maps, type: string }

  - name: infoGeneral
    label: Informations générales
    type: single
    path: src/data/infoGeneral.json
    fields:
      - { name: site.title, label: Titre du site, type: string }
      - { name: site.description, label: Description, type: string }
      - { name: site.url, label: URL du site, type: string }
      - { name: site.email.contact, label: Email contact, type: string }
      - { name: site.email.presse, label: Email presse, type: string }
      - { name: site.message.text, label: Message d'alerte, type: string }
      - {
          name: site.message.isVisible,
          label: Afficher le message,
          type: boolean,
        }
      - { name: phone.contact, label: Téléphone contact, type: string }
      - { name: phone.presse, label: Téléphone presse, type: string }
      - { name: address, label: Adresse, type: string }
      - { name: analytics.google, label: Google Analytics, type: string }
      - { name: analytics.matomo, label: Matomo, type: string }
      - { name: analytics.googleMapsLink, label: Google Maps, type: string }
      - name: social
        label: Réseaux sociaux
        type: list
        of:
          type: object
          fields:
            - { name: label, label: Réseau, type: string }
            - { name: username, label: Nom d'utilisateur, type: string }

  - name: program
    label: Programme
    type: single
    path: src/data/program.json
    fields:
      - { name: salon.schedule.Opening, label: Ouverture, type: string }
      - { name: salon.schedule.Closing, label: Fermeture, type: string }
      - { name: salon.schedule.Date, label: Date, type: string }

  - name: links
    label: Liens du site
    type: list
    path: src/data/link.json
    fields:
      - { name: label, label: Nom du lien, type: string }
      - { name: url, label: URL, type: string }

  - name: exhibitors
    label: Exposants
    type: list
    path: src/data/exhibitors.json
    fields:
      - { name: name, label: Nom, type: string }
      - { name: description, label: Description, type: string }
      - { name: category, label: Catégorie, type: string }
