media:
  input: src/assets/medias
  output: /src/assets/medias

content:
  - name: pages
    label: Pages
    path: /src/pages
    type: collection
    fields:
      - name: title
        label: Title
        type: text
        required: true
      - name: slug
        label: Slug
        type: text
        required: true
      - name: content
        label: Content
        type: markdown
        required: true
      - name: template
        label: Template
        type: select
        options:
          - default
          - blog-post
          - about-us
